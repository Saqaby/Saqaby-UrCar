# One-off: how big Saudi Arabia's (and the Gulf's) OSM speed limits would be inside the app, from Geofabrik's extract.
name: check-limits-size
on:
  push:
    paths: [".github/workflows/check-limits-size.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq osmium-tool >/dev/null
          curl -sSL -o gcc.pbf https://download.geofabrik.de/asia/gcc-states-latest.osm.pbf
          ls -l gcc.pbf
          osmium tags-filter gcc.pbf w/maxspeed -o ms.pbf --overwrite
          osmium export ms.pbf -f geojsonseq -o ms.geojsonseq --overwrite --geometry-types=linestring
          ls -l ms.pbf ms.geojsonseq
          python3 - <<'PY'
          import json, gzip, struct, collections
          b = bytearray(); ways = pts = 0; v = collections.Counter(); hw = collections.Counter()
          for line in open("ms.geojsonseq"):
              f = json.loads(line.strip().lstrip("\x1e"))
              t = f["properties"]; g = f["geometry"]["coordinates"]
              if "highway" not in t: continue
              digits = ''.join(c for c in t["maxspeed"] if c.isdigit())
              if not digits: continue
              ways += 1; pts += len(g); v[t["maxspeed"]] += 1; hw[t["highway"]] += 1
              b += struct.pack("<BH", min(255, int(digits)), len(g))
              px = py = 0
              for lon, lat in g:
                  x, y = round(lon * 1e5), round(lat * 1e5)
                  b += struct.pack("<ii", x - px, y - py); px, py = x, y
          print("ways", ways, "points", pts)
          print("values", v.most_common(12))
          print("roads", hw.most_common(12))
          print("compact bytes", len(b), "gzipped", len(gzip.compress(bytes(b), 9)))
          PY
