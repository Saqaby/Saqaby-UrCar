# Builds android/app/src/main/assets/limits.bin (src/limits_for_app.py) from Geofabrik's GCC extract of
# OpenStreetMap, commits it and builds the app with it: on the 3rd of every month, and when the script changes.
name: limits
on:
  schedule:
    - cron: "17 2 3 * *"
  workflow_dispatch:
  push:
    paths: ["src/limits_for_app.py", ".github/workflows/limits.yml"]
concurrency: limits   # one at a time, each on top of the last
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get install -y -qq osmium-tool >/dev/null
          curl -sSfL -o gcc.pbf https://download.geofabrik.de/asia/gcc-states-latest.osm.pbf
          osmium tags-filter gcc.pbf w/highway=motorway,trunk,primary,secondary,tertiary,motorway_link,trunk_link,primary_link,secondary_link,tertiary_link -o h.pbf
          osmium tags-filter h.pbf w/maxspeed -o ms.pbf
          osmium export ms.pbf -f geojsonseq -o ms.geojsonseq --geometry-types=linestring
          python3 src/limits_for_app.py ms.geojsonseq
          gzip -9 -c android/app/src/main/assets/limits.bin | wc -c
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin "$GITHUB_REF_NAME" && git reset -q --soft "origin/$GITHUB_REF_NAME"   # on top of whatever came since
          git add android/app/src/main/assets/limits.bin
          if git commit -m "assets/limits.bin from OpenStreetMap (src/limits_for_app.py)"; then
            git push
            gh workflow run app-apk.yml --ref "$GITHUB_REF_NAME"   # a push by this token starts no workflow
          fi
        env:
          GH_TOKEN: ${{ github.token }}
