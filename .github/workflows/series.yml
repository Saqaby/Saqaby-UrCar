# Builds android/app/src/main/assets/series.json (the episodes of the owner's series, src/series_for_app.py) and commits it.
name: series
on:
  workflow_dispatch:
  schedule: [{cron: "17 3 * * 0"}]   # weekly: a part may get new episodes
  push:
    paths: ["src/series_for_app.py", "src/series.json", ".github/workflows/series.yml"]
concurrency: series
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 src/series_for_app.py
      - run: |
          cp android/app/src/main/assets/series.json /tmp/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin "$GITHUB_REF_NAME" && git reset -q --hard "origin/$GITHUB_REF_NAME"
          cp /tmp/series.json android/app/src/main/assets/
          git add android/app/src/main/assets/series.json
          if git commit -m "assets/series.json from the series' YouTube playlists (src/series_for_app.py)"; then
            git push && gh workflow run app-apk.yml --ref "$GITHUB_REF_NAME"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
