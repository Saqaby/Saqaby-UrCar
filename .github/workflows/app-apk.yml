name: app-apk
# Builds the UrCar home screen (android/app) and publishes the release «app-latest»:
#   urcar.apk     the app, signed with the key in the secret URCAR_KEYSTORE_B64 (never in the repository)
#   version.json  {"versionCode": run number}; the app's updater compares it with its own
on:
  push:
    paths: ['android/app/**', 'android/*.gradle', '.github/workflows/app-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The signing key
        env:
          KEY_B64: ${{ secrets.URCAR_KEYSTORE_B64 }}
        run: |
          # without the secrets the app is only compiled (a check), never published: an update must carry the same key
          if [ -z "$KEY_B64" ]; then echo "::warning::No secret URCAR_KEYSTORE_B64: compiling only, nothing is published"; echo "SIGNED=0" >> "$GITHUB_ENV"; exit 0; fi
          echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/urcar.keystore"
          echo "SIGNED=1" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}
      - name: Build
        env:
          URCAR_KEYSTORE: ${{ runner.temp }}/urcar.keystore
          URCAR_KEYSTORE_PASSWORD: ${{ secrets.URCAR_KEYSTORE_PASSWORD }}
        run: |
          if [ "$SIGNED" = 1 ]; then gradle -p android :app:assembleRelease -PversionCode=${{ github.run_number }} --no-daemon
          else gradle -p android :app:assembleDebug --no-daemon; fi
      - if: env.SIGNED == '1'
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk urcar.apk
          echo '{"versionCode": ${{ github.run_number }}}' > version.json
          rm -f "$RUNNER_TEMP/urcar.keystore"
      - if: env.SIGNED == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: سيارتك
          body: "واجهة سيارتك. نزّل urcar.apk على الشاشة وركّبه؛ بعدها يحدّث نفسه."
          files: |
            urcar.apk
            version.json
          prerelease: true
