name: find-series
# One-off: looks for the audio series the owner asked for in public Islamic audio libraries, to stream them in the
# app's library from their own servers (nothing is copied into this repository). Removed once used.
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/find-series.yml']
jobs:
  find:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          for u in "https://ar.islamway.net/collection/4372" "https://ar.islamway.net/collection/4372?page=2" \
                   "https://ar.islamway.net/search?q=%D9%82%D8%B5%D8%A9+%D8%A7%D9%84%D9%86%D9%88%D8%B1" \
                   "https://ar.islamway.net/search?q=%D8%A7%D9%84%D8%AC%D8%B1%D9%8A%D9%88%D9%8A" \
                   "https://ar.islamway.net/search?q=%D9%81%D9%8A+%D8%B8%D9%84%D8%A7%D9%84+%D8%A7%D9%84%D8%B3%D9%8A%D8%B1%D8%A9"; do
            echo "##### $u"
            curl -sSL --max-time 40 -A "$UA" "$u" -o p.html -w "HTTP %{http_code} %{size_download}\n" || true
            python3 - <<'PY'
          import re, html
          s = open('p.html', encoding='utf-8', errors='replace').read()
          t = re.search(r'<title>(.*?)</title>', s, re.S)
          print('TITLE', t and html.unescape(t.group(1)).strip())
          seen = set()
          for m in re.finditer(r'href="([^"]*(?:/lesson/|/collection/|\.mp3)[^"]*)"[^>]*>(.*?)</a>', s, re.S):
              h, txt = m.group(1), re.sub(r'<[^>]+>', ' ', m.group(2))
              txt = ' '.join(html.unescape(txt).split())
              if h in seen: continue
              seen.add(h)
              print('LINK', h, '|', txt[:90])
          for m in sorted(set(re.findall(r'https?://[^"\'\s]+\.mp3', s)))[:20]: print('MP3', m)
          PY
          done
          echo "##### one lesson page"
          L=$(grep -o 'href="[^"]*/lesson/[0-9]*[^"]*"' p.html | head -1 | sed 's/href="//;s/"$//')
          curl -sSL --max-time 40 -A "$UA" "https://ar.islamway.net/collection/4372" -o c.html
          L=$(grep -o '/lesson/[0-9]*/[^"]*' c.html | head -1)
          echo "LESSON $L"
          curl -sSL --max-time 40 -A "$UA" "https://ar.islamway.net$L" -o l.html -w "HTTP %{http_code}\n" || true
          grep -o 'https\?://[^"]*\.mp3[^"]*' l.html | sort -u | head
          grep -o 'download[^"]*' l.html | sort -u | head
