# One-off checks for v29 (run on a push of this file): what the home du'a recording says (Whisper, to show the
# matching verified text), and whether OpenStreetMap has speed limits on the owner's roads (Overpass).
name: check-home-speed
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/check-home-speed.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Transcribe the home du'a
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q faster-whisper numpy
          ffmpeg -v error -i android/app/src/main/assets/dua/home.mp3 -ac 1 -ar 16000 -f f32le home.raw
          python3 - <<'PY'
          import numpy as np
          from faster_whisper import WhisperModel
          a = np.fromfile("home.raw", dtype=np.float32)
          m = WhisperModel("large-v3", device="cpu", compute_type="int8")
          segs, info = m.transcribe(a, language="ar", beam_size=5)
          for s in segs: print(f"[{s.start:.1f}-{s.end:.1f}] {s.text}")
          PY
      - name: Speed limits in OpenStreetMap
        continue-on-error: true
        run: |
          # the app's own query, at a point on the Dammam-Khobar highway
          curl -s -A "UrCar-check" -w "HTTP %{http_code}\n" -G --data-urlencode "data=[out:json][timeout:10];way(around:25,26.3600,50.1400)[highway][maxspeed];out tags;" https://overpass-api.de/api/interpreter | head -c 1500; echo
          for area in "Dammam:26.30,49.95,26.50,50.20" "Riyadh:24.60,46.60,24.85,46.85" "Dammam-Riyadh road:25.20,48.00,25.60,49.00"; do
            name=${area%%:*}; bb=${area#*:}
            q="[out:json][timeout:60];(way[highway~\"^(motorway|trunk|primary|secondary)$\"]($bb););out tags;"
            curl -s -A "UrCar-check" -w "HTTP %{http_code}\n" --data-urlencode "data=$q" https://overpass-api.de/api/interpreter -o r.json
            head -c 300 r.json | grep -v '^{' && echo || true
            sleep 5
            python3 - "$name" <<'PY'
          import json, sys, collections
          try: d = json.load(open("r.json"))["elements"]
          except Exception: print(sys.argv[1], "no JSON"); sys.exit(0)
          by = collections.Counter(); have = collections.Counter(); vals = collections.Counter()
          for e in d:
              t = e.get("tags", {}); k = t.get("highway"); by[k] += 1
              if "maxspeed" in t: have[k] += 1; vals[t["maxspeed"]] += 1
          print(sys.argv[1], {k: f"{have[k]}/{by[k]}" for k in by}, "values:", vals.most_common(8))
          PY
          done
